[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosystem-integrity-index"
dynamic = ["version"]
description = "Tools for calculating, accessing and analyzing the Ecosystem Integrity Index (EII)"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Benjamin Leutner", email = "benjamin.leutner@thelandbankinggroup.com"}
]
maintainers = [
    {name = "Benjamin Leutner", email = "benjamin.leutner@thelandbankinggroup.com"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
keywords = [
    "ecosystem",
    "integrity",
    "earth-engine",
    "remote-sensing",
    "biodiversity",
    "npp",
    "conservation",
]
dependencies = [
    "earthengine-api>=0.1.370",  # Only GEE API for lightweight client usage
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# For eii.compute module - full EII calculation from scratch
compute = [
    "numpy>=1.24",
    "scipy>=1.10",
    "rasterio>=1.3",
    "lightgbm>=4.0",  # FI change term: tolerance h from the stored boosters
]

# For client raster downloads
client = [
    "geopandas>=0.14",
    "pandas>=2.0",
    "numpy>=1.24",
    "rasterio>=1.3",
    "rioxarray>=0.15",
    "xarray>=2023.0",
    "matplotlib>=3.7",  # quicklook
    "contextily>=1.4",  # quicklook basemap
]

# For eii.training module - model training and validation
training = [
    "ecosystem-integrity-index[compute]",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "quantile-forest>=1.3",
]

# Scripts in pipelines/ (preprocessing, training, production, validation)
pipelines = [
    "ecosystem-integrity-index[training,client]",
    "h5py>=3.8",  # VIIRS HDF5 granules
    "numba>=0.58",
    "pyproj>=3.6",
    "pyogrio>=0.7",
    "requests>=2.31",
    "google-cloud-storage>=2.10",
    "google-crc32c>=1.5",
    "google-api-python-client>=2.0",
]

# Development dependencies
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.0",
    "ruff>=0.1.0",
    "pre-commit>=3.0",
    "mypy>=1.0",
]

# Documentation
docs = [
    "mkdocs>=1.5,<2",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
]

# Full installation with all optional dependencies
all = [
    "ecosystem-integrity-index[training,dev,docs,client,pipelines]",
]

[project.urls]
Documentation = "https://landler-io.github.io/ecosystem-integrity-index/"
Repository = "https://github.com/landler-io/ecosystem-integrity-index"
Issues = "https://github.com/landler-io/ecosystem-integrity-index/issues"
Changelog = "https://github.com/landler-io/ecosystem-integrity-index/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"eii.training" = ["model_cards/*.json"]
"eii.compute" = ["fi_change_constants/*"]

[tool.setuptools_scm]
version_file = "src/eii/_version.py"
fallback_version = "2.0.0"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["eii"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
