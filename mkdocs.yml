site_name: Ecosystem Integrity Index
site_description: An annual global index of terrestrial ecosystem integrity combining function, structure and composition
site_url: https://landler-io.github.io/ecosystem-integrity-index/
repo_url: https://github.com/landler-io/ecosystem-integrity-index
repo_name: ecosystem-integrity-index

theme:
  name: material
  palette:
    - scheme: default
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            docstring_options:
              returns_multiple_items: false
              warn_missing_types: false
            show_source: true
            heading_level: 3

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Methodology:
      - Overview: methodology/index.md
      - Functional Integrity: methodology/functional_integrity.md
      - Potential NPP Model: methodology/potential_npp.md
      - Structural Integrity: methodology/structural_integrity.md
      - Compositional Integrity: methodology/compositional_integrity.md
      - Ecosystem Integrity Index: methodology/ecosystem_integrity.md
      - Validation: methodology/validation.md
      - Local Modulation: methodology/local_modulation.md
  - Data & Assets: data-assets.md
  - Limitations: limitations.md
  - Changes from v1: v1-to-v2.md
  - API Reference:
      - Overview: api/index.md
      - eii.client: api/client.md
      - eii.client.analysis: api/analysis.md
      - eii.compute: api/compute.md
      - eii.training: api/training.md
  - Changelog: changelog.md
  - Methodology report (PDF): report/eii_v2_methodology.pdf

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/landler-io/ecosystem-integrity-index

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
