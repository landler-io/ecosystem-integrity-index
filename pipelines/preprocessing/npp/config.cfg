# Configuration file for CLMS NPP pre-processing pipeline

# Local data directories (relative paths resolve from the working directory)
NPP_OUTPUT_DIR="data/npp_annual_sums_v2"
CLMS_RAW_DATA_DIR="data/dmp_300m_10daily_v2"

# Processing parameters. EII v2 uses the Sentinel-3 OLCI years 2019-2025; the PROBA-V years
# 2014-2018 are optional (START_YEAR=2014).
START_YEAR=2019
END_YEAR=2025
# Raw download range. Optional earlier years: 2013 has only Nov-Dec (6 dekads), seasonal use
# only, no annual sum.
DOWNLOAD_START_YEAR=2019
DOWNLOAD_END_YEAR=2025
OVERWRITE=False

# Raster processing settings
NODATA_VALUE=-1
CHUNK_SIZE=512

# AWS/CDSE settings
AWS_PROFILE="cdse"
S3_BASE_PATH="s3://eodata/CLMS/bio-geophysical/dry-gross_dry_matter_productivity/dmp_global_300m_10daily_v2"
# Bash glob for product folders to download. V2.0.2 RT6 is the consolidated
# reprocessing that spans the PROBA-V to Sentinel-3 OLCI switch.
PRODUCT_GLOB="c_gls_DMP300-RT6_*_V2.0.2_cog/"
SLEEP_TIME=5
# CDSE allows 4 concurrent S3 connections per user; more returns HTTP 429.
S3_MAX_CONCURRENT_REQUESTS=4
MAX_RETRIES=8

# Processing uses one window at a time in a single process.
# CHUNK_SIZE must be a multiple of 16, at most 512.
